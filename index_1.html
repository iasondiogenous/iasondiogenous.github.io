<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Iason Diogenous — Portfolio</title>
<meta name="description" content="Portfolio of Iason Diogenous: product design and development where design, engineering and business meet.">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&display=swap">
<style>
/* Layout: a quiet white page. One continuous grid of projects on a strict repeating pattern;
   the signage bar names every project. Every project page follows the same fixed sequence.
   Greys separate the layers: page, panels and heading bands. The only colour is the blue dot. */
:root {
  /* One light theme on every device. Five neutral greys, lightest to darkest: */
  --wall: #F5F5F5;        /* page background */
  --panel: #ECECEC;       /* foreground panels: top bar, fact strip, results, contact, footer */
  --band: #E2E2E2;        /* section heading bands and image placeholders */
  --rule: #D2D2D2;        /* hairlines */
  --muted: #5F5F5F;       /* secondary text: at least 4.8:1 on every grey above */
  --ink: #1C1C1C;         /* main text */
  --mat: var(--band);
  --dot: #002FA7;         /* the accent dot: where you are, focus */
  --font: "Schibsted Grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --s-xs: 0.75rem; --s-sm: 0.875rem; --s-md: 1rem; --s-lg: 1.375rem; --s-xl: clamp(2rem, 5vw, 3.25rem);
  --gutter: clamp(16px, 4vw, 56px);
  color-scheme: light;
}

* { box-sizing: border-box; }
body {
  background: var(--wall); color: var(--ink);
  font-family: var(--font); font-size: var(--s-md); line-height: 1.55;
  padding-inline: var(--gutter); padding-block: 0 4rem;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
a:focus-visible { outline: 2px solid var(--dot); outline-offset: 4px; }
.label { font-size: var(--s-xs); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.note { font-size: var(--s-sm); color: var(--muted); }   /* small quiet text in sentence case; capitals are kept for labels on project pages */
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 1240px; margin-inline: auto; }

/* ---------- Signage bar: every project by name ---------- */
.sign {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: var(--panel);
  border-bottom: 1px solid var(--rule);
  margin-inline: calc(var(--gutter) * -1); padding-inline: var(--gutter);
}
.sign .wrap { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem 2rem; padding-block: 1rem; flex-wrap: wrap; }
.sign .name { font-weight: 600; text-decoration: none; letter-spacing: -0.01em; }
.plan { position: relative; display: flex; gap: 0.25rem 1.75rem; list-style: none; margin: 0; padding: 0; flex-wrap: wrap; }
.plan a { position: relative; padding-left: 14px; text-decoration: none; font-size: var(--s-sm); color: var(--muted); transition: color .3s; }
.plan a:hover { color: var(--ink); }
.plan a::before { content: ""; position: absolute; left: 0; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; border: 1px solid var(--rule); box-sizing: border-box; }
.plan a[aria-current="true"] { color: var(--ink); }
/* the accent dot: one marker that travels between Home, Projects and About */
.plan .dot { position: absolute; left: 0; top: 0; width: 6px; height: 6px; border-radius: 50%; background: var(--dot); pointer-events: none; transition: transform .55s cubic-bezier(.65,0,.25,1); }

/* Project names, unfolded under the signage while a project is open */
.subplan { background: var(--band); margin-inline: calc(var(--gutter) * -1); padding-inline: var(--gutter); }
.subplan ol { list-style: none; margin: 0; padding: 0.7rem 0; display: flex; flex-wrap: wrap; gap: 0.35rem 1.75rem; justify-content: flex-end; }
.subplan li { animation: unfold .45s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i, 0) * 50ms); }
.subplan a { text-decoration: none; font-size: var(--s-sm); color: var(--muted); display: inline-flex; gap: 0.5rem; transition: color .2s; }
.subplan a:hover { color: var(--ink); }
.subplan a .n { font-variant-numeric: tabular-nums; }
.subplan a[aria-current="page"] { color: var(--ink); text-decoration: underline; text-decoration-color: var(--dot); text-underline-offset: 5px; }
@keyframes unfold { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

/* ---------- Entrance ---------- */
.entrance { padding-block: clamp(3.5rem, 9vw, 7rem) clamp(3rem, 7vw, 5.5rem); display: grid; gap: clamp(1.75rem, 4vw, 3rem) clamp(2rem, 5vw, 4.5rem); align-items: start; }
.entrance .words { display: grid; gap: clamp(1.25rem, 3vw, 2rem); min-width: 0; }
.entrance .portrait { margin: 0; width: min(100%, 15rem); }
.entrance .portrait img { width: 100%; height: auto; display: block; background: var(--band); }
@media (min-width: 820px) {
  .entrance { grid-template-columns: minmax(0, 1fr) clamp(13rem, 22vw, 19rem); }
  .entrance .portrait { width: 100%; }
}
.entrance h1 { font-size: clamp(1.75rem, 4.2vw, 3.6rem); font-weight: 500; line-height: 1.08; letter-spacing: -0.03em; margin: 0; max-width: 34ch; text-wrap: balance; }
.entrance .credit { display: grid; gap: 0.2rem; margin: 0; max-width: 52ch; font-size: var(--s-lg); line-height: 1.35; }
.entrance .credit { color: var(--muted); }

/* ---------- The wall ---------- */
.hall-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; padding: 0.8rem 1.25rem; background: var(--band); }
.hall-head h2 { margin: 0; font-size: var(--s-lg); font-weight: 500; letter-spacing: -0.01em; }
.walls { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: clamp(2rem, 4vw, 3.5rem) clamp(1.5rem, 3vw, 2.5rem); padding-top: clamp(2rem, 4vw, 3rem); }

.work { display: grid; gap: 1rem; text-decoration: none; scroll-margin-top: 5rem; }
.frame { aspect-ratio: 4 / 3; max-width: 100%; background: var(--mat); display: grid; place-items: center; padding: 12%; }
.frame .piece { width: 100%; height: 100%; display: grid; place-items: center; border: 1px solid var(--rule); color: var(--muted); font-size: var(--s-sm); text-align: center; padding: 1rem; }
/* Photos are pinned inside a fixed box, so every frame is the same size whatever the image's shape */
.frame.hung, .ex-frame.hung { position: relative; overflow: hidden; padding: 0; background: var(--mat); }
.frame.hung img, .ex-frame.hung img {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; display: block;
}
.placard { display: grid; }
.placard .title { font-weight: 500; }
.placard .title { text-decoration: underline transparent; text-underline-offset: 4px; transition: text-decoration-color .25s; }
.work:hover .title, .work:focus-visible .title { text-decoration-color: var(--dot); }

.work.reserved .frame { background: transparent; border: 0; }
.work.reserved .frame .piece { border: 0; }

/* ---------- About ---------- */
.desk { padding-top: clamp(3rem, 7vw, 5rem); scroll-margin-top: 4rem; }
.visitor { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 2rem 3rem; padding-top: 2.5rem; }
.visitor p { margin: 0; max-width: 60ch; }
.contact { display: grid; gap: 0.75rem; align-content: start; align-self: start; padding: 1.25rem; background: var(--panel); }
.contact .row { padding-bottom: 0.75rem; border-bottom: 1px solid var(--rule); min-width: 0; }
.contact .row:last-child { padding-bottom: 0; border-bottom: 0; }
.contact .row a { text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 4px; transition: text-decoration-color .25s; }
.contact .row a:hover { text-decoration-color: var(--dot); }

/* ---------- Project page ---------- */
.exhibit { padding-block: 2rem 0; }
.crumb { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; font-size: var(--s-sm); color: var(--muted); }
.crumb a { text-decoration: none; }
.crumb a:hover { color: var(--ink); }
.ex-head { display: grid; gap: 0.75rem; padding-block: clamp(2.5rem, 7vw, 4.5rem) 2rem; }
.ex-head h1 { font-size: var(--s-xl); font-weight: 500; line-height: 1.08; letter-spacing: -0.025em; margin: 0; max-width: 20ch; text-wrap: balance; }
.ex-frame { aspect-ratio: 16 / 9; max-width: 100%; background: var(--mat); display: grid; place-items: center; padding: 6%; }
.ex-frame .piece { width: 100%; height: 100%; border: 1px solid var(--rule); display: grid; place-items: center; color: var(--muted); font-size: var(--s-xs); letter-spacing: 0.08em; text-transform: uppercase; text-align: center; padding: 1rem; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1.25rem 1.5rem; margin-top: 2rem; padding: 1.25rem; background: var(--panel); }
.facts div { display: grid; gap: 0.25rem; align-content: start; min-width: 0; }
.sections { display: grid; margin-top: clamp(2.5rem, 6vw, 4rem); }
.cover-credit { margin: 0.75rem 0 0; font-size: var(--s-sm); color: var(--muted); }

/* Plates: the project's process images, numbered and captioned like a catalogue */
.plates { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: clamp(1.5rem, 3vw, 2.5rem); align-items: start; margin: clamp(2.5rem, 6vw, 4rem) 0 0; padding: 0; list-style: none; }
.plate { display: grid; gap: 0.75rem; margin: 0; min-width: 0; }
.plates li.wide { grid-column: 1 / -1; }   /* a sequence that reads across the full row */
/* A pair at the top of a page shares the row equally (and stacks on phones) */
@media (min-width: 700px) {
  .plates:not(.inline):has(> li:first-child:nth-last-child(2)) { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

/* Images set into a text section.
   Phone and tablet: images sit under their paragraph in a grid that fits as many columns as the screen allows.
   Desktop: images move to a column on the right of the text. */
.sec-body { display: grid; gap: 1.5rem; min-width: 0; }
.plates.inline { margin: 0; gap: 1.25rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 13rem), 1fr)); }
.plates.inline .plate { gap: 0.5rem; }
.plates.inline img { width: auto; max-width: 100%; max-height: 22rem; }
.plates.inline figcaption { font-size: var(--s-xs); line-height: 1.45; }
@media (min-width: 1000px) {
  .sec-body.has-pics { grid-template-columns: minmax(0, 1fr) minmax(0, clamp(15rem, 30%, 22rem)); column-gap: clamp(2rem, 4vw, 3.5rem); align-items: start; }
  .plates.inline { grid-template-columns: 1fr; }
  .plates.inline li.small img { max-width: min(100%, 16rem); }
}
.plate img { width: 100%; height: auto; display: block; background: var(--mat); }
.plate figcaption { font-size: var(--s-sm); line-height: 1.45; color: var(--muted); max-width: 60ch; }
.sec { display: grid; grid-template-columns: minmax(0, 14rem) minmax(0, 1fr); gap: 1rem 2rem; padding-block: 1.75rem; border-top: 1px solid var(--rule); }
.sec p { margin: 0; max-width: 65ch; }
.sec .todo { color: var(--muted); font-style: italic; }
.limits { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; max-width: 65ch; counter-reset: c; }
.limits li { counter-increment: c; display: grid; grid-template-columns: 2.25rem 1fr; padding-block: 0.6rem; border-bottom: 1px solid var(--rule); }
.limits li:first-child { padding-top: 0; }
.limits li:last-child { border-bottom: 0; padding-bottom: 0; }
.figures { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 9.5rem), 1fr)); gap: 1.25rem 1.5rem; margin: 0; max-width: 65ch; padding: 1.25rem; background: var(--panel); }
.figures div { display: grid; gap: 0.3rem; align-content: start; min-width: 0; }
.figures dt { font-size: clamp(1.6rem, 3vw, 2.1rem); font-weight: 500; letter-spacing: -0.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.figures dd { margin: 0; font-size: var(--s-sm); color: var(--muted); line-height: 1.4; }
.limits li::before { content: counter(c, decimal-leading-zero); color: var(--muted); font-size: var(--s-sm); font-variant-numeric: tabular-nums; padding-top: 0.1rem; }
.ex-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: clamp(3rem, 7vw, 5rem); border-top: 1px solid var(--rule); }
.ex-nav a { display: grid; gap: 0.25rem; padding-top: 1.25rem; text-decoration: none; min-width: 0; }
.ex-nav a.next { text-align: right; grid-column: 2; }
.ex-nav a:hover .t { text-decoration: underline; text-underline-offset: 4px; }

footer { margin-top: 5rem; padding: 1rem 1.25rem; background: var(--panel); display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }

@media (max-width: 640px) {
  .sec { grid-template-columns: 1fr; gap: 0.5rem; }
}

/* ---------- One orchestrated entrance ---------- */
@keyframes hang { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.reveal { animation: hang .7s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i, 0) * 70ms); }
@media (prefers-reduced-motion: reduce) {
  .reveal, .subplan li { animation: none; }
  .plan .dot { transition: none; }
  .placard .title { transition: none; }
}
</style>
</head>
<body>
<header class="sign">
  <div class="wrap">
    <a class="name" href="#top">Iason Diogenous</a>
    <nav aria-label="Main">
      <ul class="plan" id="plan">
        <li><a href="#top" data-zone="home">Home</a></li>
        <li><a href="#projects" data-zone="projects">Projects</a></li>
        <li><a href="#about" data-zone="desk">About</a></li>
        <li class="dot" aria-hidden="true"></li>
      </ul>
    </nav>
  </div>
  <nav class="subplan" id="subplan" aria-label="Projects" hidden><div class="wrap"><ol id="sublist"></ol></div></nav>
</header>

<main id="top">
  <div class="wrap" id="gallery"></div>
  <div class="wrap" id="exhibit" hidden></div>
  <footer class="wrap note"><span>Iason Diogenous</span><span class="num">2026</span></footer>
</main>

<script>
/* ======================================================================
   The projects. Every project on the site comes from this list, in
   this order, so the pattern stays identical everywhere.

   Add a project by copying this template into WORKS below.

   status: "shown"    → hangs on the wall and in the signage bar
           "unlisted" → off the wall, but its page opens from a direct link (#its-title-in-lowercase-with-dashes)
           "hidden"   → off the wall and its page won't open at all

  {
    no: "01", status: "hidden",
    title: "Project name",
    year: "2026", medium: "", context: "", client: "", role: "", team: "",   // empty facts are left off the page
    cover: "images/01-name.jpg",        // cover photo, kept in the images folder
    coverAlt: "What the photo shows",
    coverFocus: "center",               // which part stays visible when the wall crops it
    lead: "images/01-lead.jpg",         // optional: a different image at the top of the project page (the cover is used if left out)
    leadAlt: "What the photo shows", leadFocus: "center",
    plates: [                           // process images, shown uncropped under the cover
      { src: "images/01-plate-name.jpg", caption: "What this shows", alt: "Description for screen readers" },
    ],
    statement: "One or two sentences on what this is.",
    constraints: ["The limits the design had to work within"],   // shown as a numbered list; leave out if none
    results: [["$399", "saved"], ["0", "failures"]],              // [figure, what it measures]; leave out if none
    sections: { Brief: "", Process: "", Outcome: "" },
  },
   ====================================================================== */
const WORKS = [
  {
    no: "01", status: "shown",
    title: "Cornell Rowing Catch Angle Marker",
    year: "Aug 2025 – May 2026", medium: "ABS-M30, 3D printed", context: "Personal project",
    client: "Ben Olsen, Assistant Coach, Cornell Heavyweight Rowing",
    role: "Product Design & Development Lead",
    cover: "images/01-catch-angle-cover.jpg",
    coverAlt: "Rowers at the catch on the water, with the orange catch angle markers mounted on the gunwale",
    coverFocus: "55% center",
    plates: [
      { src: "images/01-plate-diagram.png",
        caption: "How it works, seen from above. The blue arrows trace each oar handle travelling forward to the catch. The yellow dots are the markers and their rods, mounted on the gunwale: when the rower's knuckles touch the rod, they've reached full length.",
        alt: "Top-down sketch of a rowing shell with three rowers and their oars; dashed blue arrows run from each rower's hands forward to a yellow dot on the gunwale" },
      { src: "images/01-plate-in-use.jpg",
        caption: "The same moment on the water. The marker sits on the gunwale with its thin rod standing just ahead of the rower's hands as they come forward to the catch.",
        alt: "Close-up of a rower's hands on an oar handle beside a yellow boat, with a small orange marker on the gunwale and a thin black rod rising just ahead of the hands" },
      { src: "images/01-plate-original-cracked.jpg", section: "Brief",
        caption: "The original marker the team was using. This is an AI recreation of the cracks that overtightening caused: the broken markers were thrown away before anyone photographed them.",
        alt: "AI recreation of the original white marker block with an embossed logo and a crack running across its side from overtightening" },
      { src: "images/01-plate-version-1.jpg", section: "Process", small: true,
        caption: "Version I, the first printed prototype, with a plain round insert hole.",
        alt: "Black 3D-printed Version I marker insert on travertine, with a round insert hole and a smaller screw hole" },
      { src: "images/01-plate-version-2.jpg", section: "Process", small: true,
        caption: "Version II, the first to use the tapered fin geometry inside the insert hole, letting the rod slide smoothly while staying secure.",
        alt: "White 3D-printed Version II marker insert on travertine, with a small notched insert hole and a larger round recess" },
      { src: "images/01-plate-first-batch.jpg", section: "Outcome", small: true,
        caption: "Version III: the first batch of eight, tested on the water during the team's winter training trip in Florida.",
        alt: "Eight white 3D-printed catch angle marker inserts arranged in two columns on travertine, each with a small insert hole" },
    ],
    constraints: [
      "Must survive repeated stress and overtightening",
      "Adjustable using only the Allen key coxswains already carry",
      "Adjustments can't interrupt training",
      "Cheap enough to replace",
    ],
    results: [
      ["$399", "saved on a full set of 24, about 81% less than buying replacements"],
      ["$4", "per marker, down from $20.62 each with shipping"],
      ["45 s", "to adjust a marker, down from 90 seconds"],
      ["0", "of 24 markers cracked since deployment, across 3 boats"],
    ],
    statement: "A redesigned catch angle marker for Cornell Heavyweight Rowing: tougher, cheaper to replace, and adjustable on the water with the Allen key coxswains already carry.",
    sections: {
      Brief: "A catch angle marker is a flexible rod mounted on the boat's gunwale. As a rower reaches forward to the catch, their knuckles touch the rod, telling them they've reached full stroke length. The team's existing marker cracked easily, cost too much to replace, and could barely be adjusted once the boat was afloat. It also got in the way: the rower sitting beside a marker hit its rod every time they finished a stroke and came back. It became a constant irritation, distracting rowers from their stroke, and some removed the marker altogether, leaving the rower behind them without a reference. Working with assistant coach Ben Olsen as the client, and with a mechanical engineering student, I set out to make it more durable, easier to use, and adjustable in real time without interrupting training.",
      Process: "I defined the requirement by observing on-water sessions directly and talking with coaches and athletes. From that I set the direction early: the marker had to be adjustable and designed around the people using it, not just optimised for performance. That meant thinking first about the coxswain making changes mid-session and the rower who needs a setup that fits them. My collaborator modelled the part in Fusion, and I fabricated the prototypes, three iterations over two months, in ABS-M30 at the Human Ecology D2FS lab, a material chosen to survive repeated stress and overtightening. I replaced a proposed flathead screw with a 10 mm hex screw, so coxswains can adjust the marker with the Allen key they already carry. After on-water testing, I added a tapered fin inside the insert hole, letting the flexible rod slide smoothly while staying secure. That removed the need for secondary fasteners and cut adjustment time.",
      Outcome: "After three iterations, we produced 24 markers, one for every rower across three boats. Each cost about $4 to make, against $16.81 for an original plus $91.50 in shipping for a full order, so a complete set came to $96 instead of $494.94. Adjusting a marker now takes 45 seconds instead of 90. With only 2 minutes of rest between pieces, that gives athletes time back to focus on their stroke length. Quick adjustment also solved the irritation: each rower can raise or lower the marker to a height that stays out of their way at the finish, while keeping it within reach for the rower behind them. So the marker stays on the boat instead of being taken off. None of the 24 has cracked since they went into use. The project showed me how designing around the people who use equipment, combined with careful mechanical refinement, produces gear that performs and lasts.",

    ],
    lead: "images/02-lead-bedside.jpg",

    leadFocus: "center 55%",
    constraints: [

    ],
    statement: "A proposal for a pinecone-inspired device that would open its layers as the air gets more humid, so you can read the room at a glance instead of squinting at a number on a small screen.",

/* ====================================================================== */

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const slugOf = w => w.slug || w.title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
const SHOWN = WORKS.filter(w => (w.status || "shown") === "shown");
const OPENABLE = WORKS.filter(w => w.status !== "hidden");
const count = n => `${n} ${n === 1 ? "project" : "projects"}`;

/* Wayfinding. zone: "home" | "projects" | "desk". openNo: the project page currently open, if any. */
let zoneNow = null;
function setZone(zone, openNo = null) {
  zoneNow = zone;
  document.querySelectorAll("#plan a").forEach(a => {
    if (a.dataset.zone === zone) a.setAttribute("aria-current", "true"); else a.removeAttribute("aria-current");
  });
  placeDot();

  const sub = $("#subplan");
  if (openNo) {
    $("#sublist").innerHTML = OPENABLE.filter(w => SHOWN.includes(w) || w.no === openNo).map((w, i) =>
      `<li style="--i:${i}"><a href="#${slugOf(w)}" ${w.no === openNo ? 'aria-current="page"' : ""}>${esc(w.title)}</a></li>`
    ).join("");
    sub.hidden = false;
  } else {
    sub.hidden = true;
  }
}
function placeDot() {
  const a = document.querySelector(`#plan a[data-zone="${zoneNow}"]`);
  const dot = $("#plan .dot");
  if (!a) { dot.style.opacity = 0; return; }
  dot.style.opacity = 1;
  dot.style.transform = `translate(${a.offsetLeft}px, ${a.offsetTop + a.offsetHeight / 2 - 3}px)`;
}

function renderGallery() {
  let i = 0;
  const entrance = `
    <section class="entrance" data-zone="home">
      <div class="words">
      <h1 class="reveal" style="--i:${i++}">A product creator and developer who speaks the languages of Design, Engineering and Business.</h1>
      <p class="credit reveal" style="--i:${i++}">
        <span>I enjoy working within constraints: budgets, challenging problems, and making sure solutions are user-centred.</span>      </p>
      </div>
      <figure class="portrait reveal" style="--i:${i++}"><img src="images/00-portrait.jpg" alt="Iason Diogenous" width="796" height="1062"></figure>
    </section>`;

  const pieces = SHOWN.map(w => `
    <a class="work reveal" style="--i:${i++}" href="#${slugOf(w)}">
      ${w.cover
        ? `<div class="frame hung"><img src="${esc(w.cover)}" alt="${esc(w.coverAlt || w.title)}" loading="lazy" style="object-position:${esc(w.coverFocus || "center")}"></div>`
        : `<div class="frame"><div class="piece">Image coming soon</div></div>`}
      <div class="placard">
        <span class="title">${esc(w.title)}</span>
      </div>
    </a>`).join("");
  const reserved = `
    <div class="work reserved reveal" style="--i:${i++}" aria-hidden="true">
      <div class="frame"><div class="piece">Coming soon</div></div>
    </div>`;

  const hall = `
    <section id="projects" data-zone="projects" style="scroll-margin-top:4rem">
      <div class="hall-head"><h2>Projects</h2></div>
      <div class="walls">${pieces}${reserved}</div>
    </section>`;

  const desk = `
    <section class="desk" id="about" data-zone="desk">
      <div class="hall-head"><h2>About</h2><span class="note">Contact</span></div>
      <div class="visitor">
        <p>I'm Iason, an international student from Cyprus, currently based in the US. At Cornell I studied Design and Environmental Analysis, with an emphasis on human-centred design. I spent the same four years as a Division I rower, which taught me how to work as part of a crew, and that team became my first client. Now I'm working towards a Master of Integrated Product Design at the University of Pennsylvania's School of Engineering and Applied Science. All of it has led me to the place where design, engineering and business meet, because that is where an idea turns into a well-made, successful product created with its users in mind.</p>
        <div class="contact">
          <div class="row"><a href="mailto:diason@seas.upenn.edu">Email</a></div>
          <div class="row"><a href="https://www.linkedin.com/in/iason-diogenous/" target="_blank" rel="noopener">LinkedIn</a></div>
          <div class="row"><a href="Iason-Diogenous-Resume.pdf" target="_blank" rel="noopener">CV</a></div>
        </div>
      </div>
    </section>`;

  $("#gallery").innerHTML = entrance + hall + desk;
}

function renderExhibit(w) {
  const pos = SHOWN.indexOf(w);
  const prev = pos > 0 ? SHOWN[pos - 1] : null;
  const next = pos >= 0 && pos < SHOWN.length - 1 ? SHOWN[pos + 1] : null;
  let i = 0;
  const figs = list => list.map(p => `
        <li${p.wide ? ' class="wide"' : p.small ? ' class="small"' : ""}><figure class="plate">
          <img src="${esc(p.src)}" alt="${esc(p.alt || p.caption || "")}" loading="lazy">
          ${p.caption ? `<figcaption>${esc(p.caption)}</figcaption>` : ""}
        </figure></li>`).join("");
  const loosePlates = (w.plates || []).filter(p => !p.section);
  const secs = Object.entries(w.sections || {}).map(([k, v]) => {
    const pics = (w.plates || []).filter(p => p.section === k);
    return `
    <div class="sec">
      <span class="label">${esc(k)}</span>
      <div class="sec-body${pics.length ? " has-pics" : ""}">
        <p class="${v ? "" : "todo"}">${v ? esc(v) : "To be written."}</p>
        ${pics.length ? `<ol class="plates inline">${figs(pics)}</ol>` : ""}
      </div>
    </div>`;
  }).join("");

  $("#exhibit").innerHTML = `
    <article class="exhibit">
      <div class="crumb"><a href="#projects">← All projects</a></div>
      <header class="ex-head">
        <h1 class="reveal" style="--i:${i++}">${esc(w.title)}</h1>
      </header>
      ${(w.lead || w.cover)
        ? `<div class="ex-frame hung reveal" style="--i:${i++}"><img src="${esc(w.lead || w.cover)}" alt="${esc((w.lead ? w.leadAlt : w.coverAlt) || w.title)}" style="object-position:${esc((w.lead ? w.leadFocus : w.coverFocus) || "center")}"></div>${w.coverCredit ? `<p class="cover-credit">${esc(w.coverCredit)}</p>` : ""}`
        : `<div class="ex-frame reveal" style="--i:${i++}"><div class="piece">Image coming soon</div></div>`}
      <div class="facts">
        ${[["Year", w.year], ["Medium", w.medium], ["Context", w.context], ["Client", w.client], ["Role", w.role], ["Team", w.team]]
          .filter(([, v]) => v)
          .map(([k, v]) => `<div><span class="label">${k}</span><span class="num">${esc(v)}</span></div>`).join("")}
      </div>
      ${loosePlates.length ? `<ol class="plates">${figs(loosePlates)}</ol>` : ""}
      <div class="sections">
        <div class="sec"><span class="label">Statement</span><p class="${w.statement ? "" : "todo"}">${w.statement ? esc(w.statement) : "To be written."}</p></div>
        ${w.constraints?.length ? `<div class="sec"><span class="label">Constraints</span><ol class="limits">${w.constraints.map(c => `<li>${esc(c)}</li>`).join("")}</ol></div>` : ""}
        ${w.results?.length ? `<div class="sec"><span class="label">Results</span><dl class="figures">${w.results.map(([n, t]) => `<div><dt>${esc(n)}</dt><dd>${esc(t)}</dd></div>`).join("")}</dl></div>` : ""}
        ${secs}
      </div>
      <nav class="ex-nav" aria-label="Previous and next project">
        ${prev ? `<a href="#${slugOf(prev)}"><span class="note">← Previous</span><span class="t">${esc(prev.title)}</span></a>`
               : `<a href="#projects"><span class="note">← Back to</span><span class="t">All projects</span></a>`}
        ${next ? `<a class="next" href="#${slugOf(next)}"><span class="note">Next →</span><span class="t">${esc(next.title)}</span></a>`
               : `<a class="next" href="#about"><span class="note">Next →</span><span class="t">About</span></a>`}
      </nav>
    </article>`;
}

/* On the homepage, the dot follows where you are as you scroll */
let onGallery = true, ticking = false;
function zoneFromScroll() {
  if (!onGallery) return;
  const mid = window.innerHeight * 0.45;
  const nearBottom = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4;
  let zone = "home";
  document.querySelectorAll("#gallery [data-zone]").forEach(s => {
    if (s.getBoundingClientRect().top <= mid) zone = s.dataset.zone;
  });
  if (nearBottom && window.scrollY > 0) zone = "desk";
  if (window.scrollY < 8) zone = "home";
  if (zone !== zoneNow) setZone(zone);
}
window.addEventListener("scroll", () => {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => { ticking = false; zoneFromScroll(); });
}, { passive: true });
window.addEventListener("resize", placeDot);
document.fonts?.ready.then(placeDot);

function route() {
  const h = location.hash.slice(1);
  const w = OPENABLE.find(x => slugOf(x) === h || "no-" + x.no === h);   // old numbered links still open
  const g = $("#gallery"), ex = $("#exhibit");
  if (w) {
    onGallery = false;
    renderExhibit(w);
    g.hidden = true; ex.hidden = false;
    setZone("projects", w.no);
    window.scrollTo(0, 0);
  } else {
    const wasHidden = g.hidden;
    onGallery = true;
    g.hidden = false; ex.hidden = true;
    if (wasHidden) renderGallery();
    setZone(h === "about" ? "desk" : h === "projects" ? "projects" : "home");
    const target = h && h !== "top" ? document.getElementById(h) : null;
    if (target) target.scrollIntoView(); else window.scrollTo(0, 0);
  }
}

/* Pictures load whether they sit in an "images" folder or loose next to this file */
document.addEventListener("error", e => {
  const img = e.target;
  if (img.tagName !== "IMG" || img.dataset.retried) return;
  img.dataset.retried = "1";
  const src = img.getAttribute("src") || "";
  img.src = src.startsWith("images/") ? src.slice(7) : "images/" + src;
}, true);

renderGallery(); setZone("home");
window.addEventListener("hashchange", route);
if (location.hash) route(); else zoneFromScroll();
</script>
